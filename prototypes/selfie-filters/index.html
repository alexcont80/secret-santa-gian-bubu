<!doctype html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#113c33"><title>Camerino di Natale · Secret Santa</title>
<link rel="stylesheet" href="./studio.css"><script type="module" src="./studio.mjs"></script>
</head>
<body><main class="studio">
<header><span class="event">Secret Santa <b>✳</b> Gian &amp; Bubu</span><h1>Camerino di Natale</h1></header>
<div class="layout"><div class="stage" id="stage">
  <video id="camera" autoplay muted playsinline aria-hidden="true"></video>
  <canvas id="picture" width="768" height="960" aria-label="Anteprima selfie con gli accessori selezionati"></canvas>
  <div class="idle" id="idle"><div class="hat-display" aria-hidden="true"><img src="./art/antler.webp" alt=""><img src="./art/antler.webp" alt=""><img src="./art/hat.webp" alt=""></div>
  <button id="open" class="primary">Attiva fotocamera</button></div>
</div>
<section class="controls" aria-label="Comandi del selfie">
  <div class="wardrobe"><h2>Accessori</h2>
    <div class="choices">
      <button data-item="hat" aria-pressed="true"><img src="./art/hat.webp" alt=""><span>Cappello da renna</span></button>
      <button data-item="nose" aria-pressed="false"><i class="nose"></i><span>Naso di Rudolf</span></button>
      <button data-item="beard" aria-pressed="false"><img src="./art/beard.webp" alt=""><span>Barba di Babbo</span></button>
    </div>
  </div>
  <p id="status" role="status" aria-live="polite">Scegli gli accessori e attiva la fotocamera.</p>
  <div id="live" hidden><button id="snap" class="primary" disabled>Scatta selfie</button>
    <button id="stop" class="secondary">Spegni fotocamera</button></div>
  <div id="review" hidden><a id="save" class="primary" download="secret-santa-selfie.webp">Scarica selfie</a>
    <button id="use" class="primary" hidden>Usa questo selfie</button><button id="retake" class="secondary">Nuovo scatto</button></div>
</section></div></main></body></html>
